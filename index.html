<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Нейро-Мастер">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Нейро-Мастерская — контент с телефона</title>
<script>try{var t=localStorage.getItem('nm_theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07080d;--surf:rgba(255,255,255,.055);--surf2:rgba(255,255,255,.1);--surf3:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.16);
  --tx:#f2f4fa;--tx2:#a9b3c9;--tx3:#636e89;
  --vio:#7c6cff;--mag:#b45cff;--teal:#3dd9c0;--amber:#ffb03a;--rose:#ff7a8a;--green:#3ddc97;--blue:#5ac8fa;
  --grad:linear-gradient(135deg,#7c6cff,#b45cff);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.22,.8,.24,1);
}
[data-theme="light"]{
  --bg:#f6f5f1;--surf:rgba(20,20,30,.045);--surf2:rgba(20,20,30,.08);--surf3:rgba(20,20,30,.12);
  --line:rgba(20,20,30,.1);--line2:rgba(20,20,30,.22);
  --tx:#191b22;--tx2:#4f5566;--tx3:#8b92a6;
}
[data-theme="light"] body::before{opacity:.8}
[data-theme="light"] .filterbar{background:linear-gradient(rgba(246,245,241,.97),rgba(246,245,241,.86))}
[data-theme="light"] .tabbar{background:rgba(250,249,246,.9)}
[data-theme="light"] .card{background:linear-gradient(180deg,#ffffff,#fcfbf7);
  box-shadow:0 1px 2px rgba(35,30,15,.05),0 16px 36px -26px rgba(35,30,15,.35)}
[data-theme="light"] .seg{background:rgba(20,20,30,.06)}
[data-theme="light"] .seg button.on{background:#fff;box-shadow:0 2px 8px rgba(35,30,15,.13)}
[data-theme="light"] .chip{background:#fff}
[data-theme="light"] .hdbtn:active{background:rgba(20,20,30,.045)}
[data-theme="light"] .fr:active{background:rgba(20,20,30,.05)}
[data-theme="light"] #totop{background:rgba(255,255,255,.94)}
[data-theme="light"] .ptext{background:#fff!important}
[data-theme="light"] .warnbox{color:#8a5400;background:rgba(255,176,58,.16)}
[data-theme="light"] .hero{background:linear-gradient(135deg,rgba(124,108,255,.13),rgba(180,92,255,.07))}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"kern","liga";letter-spacing:-.01em;
  padding-bottom:calc(86px + var(--sab));
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(640px 420px at 88% -6%, rgba(124,108,255,.17), transparent 62%),
  radial-gradient(560px 380px at -10% 10%, rgba(180,92,255,.12), transparent 60%),
  radial-gradient(620px 460px at 50% 108%, rgba(61,217,192,.06), transparent 62%)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(18px,var(--sal));padding-right:max(18px,var(--sar))}

/* ---- шапка ---- */
header{position:relative;z-index:1}
.headrow{display:flex;align-items:center;gap:12px;padding-top:calc(18px + var(--sat));padding-bottom:8px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;
  color:#fff;flex:none;box-shadow:0 10px 30px -10px rgba(124,108,255,.65)}
.brand b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand span{display:block;font-size:12.5px;color:var(--tx2);margin-top:1px}
.thm{margin-left:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--surf);color:var(--tx2);display:grid;place-items:center;cursor:pointer;flex:none;
  transition:all .2s var(--ease)}
.thm:active{transform:scale(.9)}

/* ---- фильтр-бар ---- */
.filterbar{position:sticky;top:0;z-index:30;padding:8px 0 8px;
  background:linear-gradient(rgba(7,8,13,.95),rgba(7,8,13,.8));backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5)}
.fbin{max-width:680px;margin:0 auto;padding-left:max(18px,var(--sal));padding-right:max(18px,var(--sar))}
.search{display:flex;align-items:center;gap:9px;height:44px;padding:0 14px;border-radius:15px;
  background:var(--surf);border:1px solid var(--line);color:var(--tx3);transition:border-color .2s}
.search:focus-within{border-color:rgba(124,108,255,.55);background:rgba(255,255,255,.075)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);
  font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--tx3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.clear{display:none;width:26px;height:26px;border-radius:50%;border:0;background:var(--surf2);color:var(--tx3);
  font-size:15px;line-height:1;cursor:pointer;flex:none;padding:0}
.search.has .clear{display:block}
.seg{display:flex;gap:3px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:13px;padding:3px;margin-top:8px}
.seg button{flex:1;border:0;background:transparent;color:var(--tx2);font:600 13px/1 inherit;
  padding:0;height:36px;border-radius:10px;cursor:pointer;transition:all .22s var(--ease);letter-spacing:0}
.seg button.on{background:rgba(255,255,255,.13);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.seg button:active{transform:scale(.97)}

/* ---- чипсы ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;display:inline-flex;align-items:center;gap:5px;padding:0 13px;border-radius:19px;
  border:1px solid var(--line);background:var(--surf);color:var(--tx2);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s var(--ease);user-select:none;white-space:nowrap}
.chip .n{font-size:11px;color:var(--tx3);font-weight:700}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px -8px rgba(124,108,255,.7)}
.chip.on .n{color:rgba(255,255,255,.75)}
.chip:active{transform:scale(.95)}

/* ---- список ---- */
main{position:relative;z-index:1}
.sect{font-size:12px;font-weight:700;letter-spacing:.13em;color:var(--tx3);text-transform:uppercase;
  margin:24px 6px 10px;display:flex;gap:8px;align-items:baseline}
.sect i{font-style:normal;font-weight:600;letter-spacing:0;color:var(--tx3);opacity:.7}
.sect .semo{font-size:14px;letter-spacing:0}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.028));
  border:1px solid var(--line);border-radius:22px;margin-bottom:11px;overflow:hidden;
  transition:border-color .25s var(--ease),transform .25s var(--ease)}
.card.open{border-color:var(--line2)}
.hd{display:flex;align-items:stretch}
.hdbtn{flex:1;min-width:0;display:flex;align-items:flex-start;gap:11px;text-align:left;background:none;border:0;
  color:inherit;font:inherit;cursor:pointer;padding:14px 6px 13px 15px;transition:background .2s}
.hdbtn:active{background:rgba(255,255,255,.05)}
.tic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  font-size:20px;line-height:1;border:1px solid}
.hcol{flex:1;min-width:0}
.tname{display:block;font-size:16px;font-weight:650;line-height:1.3;letter-spacing:-.02em}
.tag{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:13px;line-height:1.35;color:var(--tx2);margin-top:2px}
.card.open .tag{-webkit-line-clamp:unset}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.bd{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:99px;
  border:1px solid;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.bd .dt{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.chev{flex:none;margin-top:9px;color:var(--tx3);transition:transform .3s var(--ease)}
.card.open .chev{transform:rotate(180deg)}
.fbtn{flex:none;width:50px;background:none;border:0;color:var(--tx3);cursor:pointer;
  display:grid;place-items:center;transition:color .2s var(--ease)}
.fbtn svg{fill:none;stroke:currentColor}
.fbtn:active{transform:scale(.88)}
.fbtn.on{color:var(--amber)}
.fbtn.on svg{fill:var(--amber)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--ease)}
.card.open .body{grid-template-rows:1fr}
.bin{overflow:hidden}
.pad{border-top:1px solid var(--line);padding:4px 16px 16px}
.sec-t{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin:15px 0 6px}
.p{font-size:14.5px;line-height:1.5;color:var(--tx2);margin:0}
.p b{color:var(--tx);font-weight:600}
.steps{list-style:none;margin:2px 0 0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 0 33px;margin:0 0 10px;font-size:14.5px;line-height:1.45;color:var(--tx2)}
.steps li:last-child{margin-bottom:0}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;
  border-radius:50%;background:var(--grad);color:#fff;font-size:11.5px;font-weight:700;line-height:22px;
  text-align:center}
.steps li b{color:var(--tx);font-weight:650}
.plist,.mlist{list-style:none;margin:0 0 6px;padding:0}
.plist li,.mlist li{position:relative;padding:0 0 0 24px;margin:0 0 7px;font-size:14px;line-height:1.42;color:var(--tx2)}
.plist li:before{content:"✓";position:absolute;left:2px;top:0;color:var(--green);font-weight:700;font-size:13px}
.mlist li:before{content:"−";position:absolute;left:2px;top:0;color:var(--rose);font-weight:700;font-size:14px}
.warnbox{margin:12px 0 0;padding:10px 12px;border-radius:14px;background:rgba(255,176,58,.09);
  border:1px solid rgba(255,176,58,.3);color:#ffd9a1;font-size:13.5px;line-height:1.45}
.infogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0 0}
.infogrid div{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:8px 11px}
.infogrid i{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tx3);margin-bottom:2px}
.infogrid b{font-size:13.5px;font-weight:600;color:var(--tx)}
.acts{display:flex;gap:8px;margin-top:15px}
.openbtn{flex:1;height:48px;border-radius:15px;background:var(--grad);color:#fff;text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:15px;
  box-shadow:0 10px 24px -10px rgba(124,108,255,.7);transition:transform .2s var(--ease)}
.openbtn:active{transform:scale(.97)}
.ghostbtn{flex:none;height:48px;padding:0 14px;border-radius:15px;border:1px solid var(--line);
  background:var(--surf);color:var(--tx2);font:600 13px inherit;font-family:inherit;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .2s var(--ease);
  white-space:nowrap}
.ghostbtn:active{transform:scale(.96)}
.ghostbtn.on{color:var(--amber);border-color:rgba(255,176,58,.45);background:rgba(255,176,58,.1)}
.ghostbtn.ok{color:var(--green);border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.1)}
.ghostbtn svg{flex:none}
.plusbtn{flex:none;height:48px;border-radius:15px;border:1px dashed var(--line2);background:none;
  color:var(--tx2);font:600 13.5px inherit;font-family:inherit;padding:0 14px;display:inline-flex;
  align-items:center;gap:6px;cursor:pointer;transition:all .2s var(--ease)}
.plusbtn:active{transform:scale(.96)}
.alts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:13px}
.alts .lbl{font-size:12px;color:var(--tx3);font-weight:600}
.altchip{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--surf);color:var(--tx2);cursor:pointer;transition:all .2s var(--ease);font-family:inherit}
.altchip:active{transform:scale(.95)}

/* ---- герой / интро ---- */
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid rgba(124,108,255,.32);
  background:linear-gradient(135deg,rgba(124,108,255,.17),rgba(180,92,255,.09));padding:16px;margin:6px 0 2px}
.hero b{display:block;font-size:16.5px;letter-spacing:-.02em;line-height:1.3}
.hero p{margin:5px 0 13px;font-size:13.5px;color:var(--tx2);line-height:1.45}
.hero .hbtns{display:flex;gap:8px;flex-wrap:wrap}
.intro{border-radius:22px;border:1px solid var(--line);background:var(--surf);padding:15px 16px;margin:6px 0 0;
  font-size:13.5px;line-height:1.5;color:var(--tx2)}
.intro b{color:var(--tx)}

/* ---- промпты ---- */
.ptext{margin:11px 0 0;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.045);
  border:1px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--tx2);white-space:pre-wrap;
  word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0}
.pfor{font-size:12.5px;color:var(--tx3);font-weight:600;margin-top:3px}
.pex{margin-top:9px;font-size:13px;line-height:1.45;color:var(--tx3)}
.pex b{color:var(--tx2);font-weight:600}
.copyrow{display:flex;gap:8px;margin-top:11px}

/* ---- чек-лист ---- */
.clcard{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.028));overflow:hidden;margin-bottom:11px}
[data-theme="light"] .clcard{background:linear-gradient(180deg,#ffffff,#fcfbf7);box-shadow:0 1px 2px rgba(35,30,15,.05),0 16px 36px -26px rgba(35,30,15,.35)}
.clhead{padding:14px 16px 10px}
.clhead b{font-size:16px;font-weight:650;letter-spacing:-.02em}
.clhead span{display:block;font-size:12.5px;color:var(--tx3);margin-top:2px}
.pbar{height:8px;border-radius:99px;background:var(--surf2);overflow:hidden;margin:10px 0 0}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .4s var(--ease);width:0}
.clrow{display:flex;gap:11px;align-items:flex-start;padding:12px 16px;min-height:56px;cursor:pointer;
  transition:background .16s;border-top:1px solid var(--line)}
.clrow:active{background:rgba(255,255,255,.06)}
.cbx{flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line2);display:grid;
  place-items:center;margin-top:1px;transition:all .2s var(--ease);color:#fff}
.clrow.on .cbx{background:var(--grad);border-color:transparent}
.cbx svg{opacity:0;transition:opacity .18s}
.clrow.on .cbx svg{opacity:1}
.cltxt{flex:1;min-width:0}
.cltxt b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.35}
.cltxt span{font-size:12.5px;color:var(--tx3);line-height:1.4;display:block;margin-top:2px}
.clrow.on .cltxt b{color:var(--tx3);text-decoration:line-through;text-decoration-thickness:1px}
.clrow.on .cltxt span{opacity:.6}

/* ---- строки-настройки ---- */
.setcard{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.028));overflow:hidden;margin-bottom:11px}
[data-theme="light"] .setcard{background:linear-gradient(180deg,#ffffff,#fcfbf7)}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:58px;cursor:pointer;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;font:inherit;font-family:inherit}
.setrow:first-child{border-top:0}
.setrow:active{background:rgba(255,255,255,.06)}
.setrow .sic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surf2);color:var(--tx2)}
.setrow .stx{flex:1;min-width:0}
.setrow .stx b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.setrow .stx span{display:block;font-size:12.5px;color:var(--tx3);margin-top:1px}
.sw{flex:none;width:50px;height:30px;border-radius:99px;background:var(--surf3);position:relative;transition:background .25s var(--ease)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  transition:transform .25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.setrow.on .sw{background:var(--grad)}
.setrow.on .sw i{transform:translateX(20px)}
.setrow .chev2{flex:none;color:var(--tx3)}

/* ---- строки избранного ---- */
.fr{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:58px;text-decoration:none;
  color:var(--tx);transition:background .16s;cursor:pointer;border-top:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;font-family:inherit}
.fr:first-child{border-top:0}
.fr:active{background:rgba(255,255,255,.07)}
.fic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;border:1px solid}
.fn{flex:1;min-width:0}
.fn b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.fn span{display:block;font-size:12px;color:var(--tx3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fgo{flex:none;color:var(--tx3)}

.empty{text-align:center;color:var(--tx3);padding:60px 24px;font-size:15px}
.empty b{display:block;font-size:34px;margin-bottom:14px}
.empty .ghostbtn{margin:16px auto 0;display:inline-flex}

/* ---- подвал ---- */
footer{position:relative;z-index:1;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  color:var(--tx3);font-size:12.5px;line-height:1.6}
footer b{color:var(--tx2);font-weight:600}

/* ---- вкладки ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(9,10,16,.85);backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--line);
  padding:5px max(8px,var(--sal)) calc(5px + var(--sab)) max(8px,var(--sar))}
.tabbar button{flex:1;background:none;border:0;color:var(--tx3);font:600 10.5px/1.2 inherit;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 4px;border-radius:14px;
  cursor:pointer;letter-spacing:0;transition:color .2s var(--ease)}
.tabbar button svg{transition:transform .25s var(--ease),color .2s}
.tabbar button:active{transform:scale(.94)}
.tabbar button.on{color:var(--tx)}
.tabbar button.on svg{color:var(--vio);transform:translateY(-1px)}
[data-theme="light"] .tabbar button.on svg{color:#6a58ff}

#totop{position:fixed;right:calc(18px + var(--sar));bottom:calc(88px + var(--sab));z-index:40;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);cursor:pointer;
  background:rgba(20,24,39,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--tx2);display:grid;place-items:center;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease);transform:translateY(8px)}
#totop.show{opacity:1;pointer-events:auto;transform:none}
#totop:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

ff":3,"watermark":"Нет","commercial":"Да","where":"Компьютер (Windows)","warn":"Для смелых: установка не для новичка, придётся выбирать модели. Хороший вариант, если рядом есть компьютер и нужен «минус как в студии».","steps":[{"t":"Скачай программу со страницы на GitHub","d":"кнопка Releases, установщик для Windows."},{"t":"Установи на компьютер","d":"лучше на диск C, чтобы в пути не было русских букв."},{"t":"Выбери модель и загрузи песню","d":"для старта подойдёт Demucs v4."},{"t":"Раздели и сохрани","d":"WAV-файл минусовки появится в папке, которую сам укажешь."}],"plus":["Лучшее качество из возможных, и бесплатно","Никаких лимитов и очередей"],"minus":["Только компьютер, желательно мощный","Установка и настройки — для опытных"],"alt":["mvsep","fadr"],"keys":"uvr ultimate vocal remover компьютер windows студия качество"}],"guides":[{"id":"slovar","emo":"📚","title":"Словарик: 10 слов, которые встретишь везде","sub":"Пять минут — и все карточки в каталоге станут понятными","time":"5 минут","diff":1,"intro":"Нейросети любят непонятные слова. Вот самые частые — по-простому, без зауми.","steps":[{"t":"Промпт","d":"это твой запрос, написанный словами. «Нарисуй кота в шляпе» — уже промпт. Чем подробнее, тем лучше результат."},{"t":"Нейросеть (ИИ)","d":"программа, которая «научилась» на миллионах примеров и теперь сама придумывает тексты и картинки. Ничего волшебного — просто очень начитанная программа."},{"t":"Сгенерировать","d":"создать. «Сгенерируй картинку» = «сделай картинку»."},{"t":"Лимит","d":"бесплатный запас на день или месяц: например, 5 генераций в день. Кончился — до завтра (или платно)."},{"t":"Кредиты","d":"то же, что лимит, только измеряется в «монетках сервиса»: одна генерация стоит 5 кредитов, у тебя 50 — значит 10 генераций."},{"t":"Водяной знак","d":"полупрозрачный логотип сервиса на картинке или видео. Обычно есть на бесплатных тарифах."},{"t":"Коммерческое использование","d":"можно ли зарабатывать на результате: продавать, ставить в монетизируемое видео. Если «только личное» — используешь для себя, но не в заработке."},{"t":"VPN","d":"программа, которая «переносит» тебя в другую страну, чтобы открылись зарубежные сайты. Некоторые нейросети из России без него не работают."},{"t":"Апскейл","d":"увеличение картинки с улучшением качества: была мутная — стала чёткая."},{"t":"Токен","d":"кусочек текста, которым нейросеть «думает». Тебе это знать не обязательно — просто слово из инструкций."}],"tip":"Заглядывай сюда, когда в карточке встретится непонятное слово. Через неделю всё станет привычным."},{"id":"appleid","emo":"🍎","title":"Зарубежный Apple ID: открывает половину каталога","sub":"Чтобы устанавливать приложения, которых нет в российском App Store","time":"20 минут","diff":2,"intro":"Многие нейросети (ChatGPT, Gemini, Leonardo, Captions) в российском App Store не показываются. Обходной путь — бесплатный Apple ID другой страны, например США или Казахстана. Платить ничего не нужно: выбирается способ оплаты «Нет» и бесплатные приложения ставятся нормально.","warn":"Это не взлом и не нарушение — просто второй аккаунт. Но: не выходи из своего основного Apple ID без нужды, приложения обновляй под тем аккаунтом, с которым скачала.","steps":[{"t":"Возьми отдельную почту","d":"заведи бесплатную почту, например на mail.ru или Яндекс — она не должна быть привязана к российскому Apple ID."},{"t":"Создай Apple ID со сменой страны","d":"на сайте appleid.apple.com → «Создать Apple ID». В качестве региона укажи США или Казахстан."},{"t":"Способ оплаты — «Нет»","d":"при создании аккаунта выбери «None» (Нет). Адрес можно указать простой, например отель в нужном городе — по нему ничего не присылают."},{"t":"Войди в App Store","d":"Настройки телефона → «Медиаматериалы и покупки» → добавь новый аккаунт. Теперь в поиске App Store появились все зарубежные приложения."},{"t":"Скачай нужные приложения","d":"ChatGPT, Gemini, Leonardo, Kling и другие — из каталога. Часто для их работы дополнительно нужен VPN."}],"tip":"Если при создании просят карту — значит, где-то выбран неверный регион или остался старый адрес. Вернись и проверь: в аккаунте должно быть «Оплата: Нет»."},{"id":"vpn-safety","emo":"🛡️","title":"VPN и безопасность аккаунтов: что важно знать","sub":"Чтобы не потерять аккаунт и не переживать зря","time":"10 минут","diff":2,"intro":"Часть сервисов из каталога работает из России только через VPN. Это несложно, но есть несколько правил, которые уберегут твои аккаунты и нервы.","warn":"С 2026 года OpenAI, Anthropic и Google периодически блокируют аккаунты, которые заходят из России — даже через VPN. Полностью застраховаться нельзя, поэтому правило простое: не храни в зарубежных сервисах ничего незаменимого.","steps":[{"t":"Начни с сервисов без VPN","d":"GigaChat, Шедеврум, Kling, VN — их хватит на первые ролики, и риска ноль."},{"t":"Если нужен VPN — выбирай платный и известный","d":"бесплатные VPN часто медленные и сами собирают данные."},{"t":"Включил VPN — работай, выключил — не удивляйся","d":"что сайт снова не грузится. Это нормально."},{"t":"Не привязывай к зарубежным аккаунтам важное","d":"старую почту, банковскую карту, основную память."},{"t":"Не покупай «доступы» у случайных людей","d":"в Telegram часто продают чужие аккаунты — их блокируют, деньги пропадают."},{"t":"Пароли — разные","d":"для каждого сервиса свой. Это защита от того, что один «потёкший» сайт утащит все остальные."}],"tip":"Страшного здесь меньше, чем кажется: миллионы людей делают так каждый день. Просто относись к зарубежным сервисам как к гостям — приятно, но не храни у них ценности."},{"id":"first-image","emo":"🎨","title":"Первая картинка за 10 минут","sub":"Шедеврум — самый простой вход, без VPN и регистраций","time":"10 минут","diff":1,"intro":"Начнём с малого: сделаем картинку. Это упражнение — «первый шаг», после него всё остальное перестаёт пугать.","steps":[{"t":"Установи «Шедеврум»","d":"в App Store по поиску «Шедеврум» (или открой shedevrum.ai в Safari). Вход — по Яндекс ID."},{"t":"Нажми «Создать»","d":"и напиши описание: «рыжий кот в соломенной шляпе сидит на грядке с клубникой, солнечный день, мультфильм»."},{"t":"Получи 4 варианта","d":"выбери лучший. Не понравилось — измени одно слово в описании и попробуй снова."},{"t":"Сохрани картинку","d":"Нажми «поделиться» → «Сохранить изображение». Она в галерее телефона."},{"t":"Полистай ленту","d":"найди картинку, которая нравится, и нажми «Повторить» — увидишь её описание. Это лучший способ учиться."}],"tip":"Правило описания: КТО + ЧТО ДЕЛАЕТ + ГДЕ + КАК ВЫГЛЯДИТ (стиль, свет, время суток). Чем конкретнее, тем красивее результат."},{"id":"first-video","emo":"🎬","title":"Первое видео из текста","sub":"Kling — работает из России без VPN","time":"30 минут","diff":2,"intro":"Видео — это кино из кусочков по 5–10 секунд. Сделаем один кусочек со звуком... то есть с движением, и поймём всю механику.","warn":"На бесплатном тарифе Kling водяной знак и запрет на заработок — это для учёбы и для души. Когда захочешь монетизацию, посмотри раздел «Для YouTube» в гайде про правила.","steps":[{"t":"Зарегистрируйся на klingai.com","d":"по e-mail, без VPN. Или установи приложение Kling AI."},{"t":"Сделай картинку-основу","d":"в Шедевруме — например, «бабушка собирает яблоки в саду, осень»."},{"t":"В Kling выбери «Image to Video»","d":"загрузи картинку."},{"t":"Напиши, что двигается","d":"«камера медленно приближается, яблоко падает в корзину, листья колышутся»."},{"t":"Сгенерируй и скачай","d":"кредиты обновляются каждый день — пробуй следующий кадр завтра."}],"tip":"Пиши в описании именно ДВИЖЕНИЕ и КАМЕРУ: «камера облетает», «медленно приближается», «предмет крутится». Из неподвижной картинки с текстом движения не сделаешь."},{"id":"photo-alive","emo":"👤","title":"Оживление фото","sub":"Пусть заговорит или затанцует","time":"20 минут","diff":2,"intro":"Самое эффектное для родных и друзей: фотография начинает говорить или танцевать. Делается с телефона за пару минут.","steps":[{"t":"Возьми хорошее фото","d":"лицо крупно, прямо в камеру, без солнечных очков."},{"t":"Для «заговорит» — Hedra","d":"загрузи фото и запиши/сгенерируй озвучку (например, в GigaChat)."},{"t":"Для «затанцует» — Viggle","d":"5 бесплатных видео каждый день. Загрузи персонажа и выбери движение."},{"t":"Скачай сразу","d":"Viggle хранит видео только 7 дней."}],"tip":"Не делай такие видео из фото других людей без их согласия — это уже не шутка. И не публикуй «оживлённых» родственников без их разрешения."},{"id":"voice-music","emo":"🎙️","title":"Озвучка и музыка для ролика","sub":"Три надёжных бесплатных источника звука","time":"30 минут","diff":2,"intro":"У видео три звуковые дорожки: голос, музыка и тишина между ними. Разберём каждую.","steps":[{"t":"Голос — два пути","d":"запиши сама (честно и живо!) или доверь Yandex SpeechKit — там студийный русский голос."},{"t":"Самый простой способ записи","d":"Диктофон в iPhone или сразу в CapCut: наговори текст с паузами."},{"t":"Музыка — только безопасная","d":"YouTube Studio → «Аудиотека»: тысячи треков, за которые канал не накажут. Или Stable Audio."},{"t":"Тишина — тоже приём","d":"убери музыку на 2–3 секунды перед важным моментом — внимание зрителя обострится."}],"tip":"Музыку всегда делай тише голоса на 15–20%. В CapCut: выбери дорожку музыки → «Громкость» → поставь примерно 25%."},{"id":"minus-track","emo":"🎤","title":"Минусовка своими руками: голос отдельно, музыка отдельно","sub":"Убираем вокал из любимой песни на iPhone","time":"10 минут","diff":1,"intro":"Минусовка — это та же песня, но без голоса: остаётся музыка. С ней удобно петь, записывать кавер или делать караоке-видео. Делается просто — главное, чтобы песня была файлом в телефоне.","warn":"Из Apple Music и других стримингов песню взять нельзя — там защита от копирования. Нужен файл mp3 или m4a в приложении «Файлы»: попроси скачать на компьютере, из переписки или с флешки. И помни: чужая минусовка — для души; выкладывать и зарабатывать на ней без прав на песню нельзя.","steps":[{"t":"Проверь «Файлы»","d":"открой «Файлы» → «Загрузки»: есть там песня? Если нет — сначала добудь файл."},{"t":"Самый простой путь — приложение Moises","d":"установи из App Store, добавь песню, подожди пару минут и скачай дорожку «Instrumental». Это и есть минусовка. Бесплатно — 5 песен в месяц."},{"t":"Или в браузере — без установки","d":"в Safari открой vocalremover.org → «Browse my files» → выбери песню → скачай «Instrumental». Минус готов через минуту."},{"t":"Сначала поищи готовую","d":"на x-minus.me введи название песни: в библиотеке 700 тысяч минусовок. Профессиональный минус обычно звучит лучше, чем вырезанный нейросетью."},{"t":"Если хочется идеала","d":"на mvsep.com выбери модель «2 stems: BS Roformer» — качество заметно выше; бесплатно до 50 песен в день, но очередь может постоять."},{"t":"Сохрани и пользуйся","d":"файл лежит в «Файлы» → «Загрузки». Под него можно петь или закинуть его в CapCut для караоке-видео — это следующий гайд."}],"tip":"Лимиты: в Moises бесплатно 5 песен в месяц, а vocalremover.org и mvsep.com куда щедрее — держи их как запасные. А ещё в Moises можно выключить голос и слушать минус, не скачивая файл."},{"id":"edit-phone","emo":"✂️","title":"Монтаж и субтитры на iPhone","sub":"Собираем ролик из клипов за вечер","time":"40 минут","diff":2,"intro":"Монтаж — это просто «нарезать и склеить». Разберём на примере CapCut; если что-то не работает из России — VN делает то же самое.","steps":[{"t":"Собери все кусочки","d":"видео и картинки из галереи, готовые клипы Kling — сохрани всё во «Фото»."},{"t":"CapCut → «Новый проект»","d":"добавь клипы, лишнее обрежь: тяни за края клипа."},{"t":"Звук","d":"добавь музыкальную дорожку из аудиотеки YouTube, поставь громкость ~25%."},{"t":"Субтитры","d":"кнопка «Текст» → «Автоматические субтитры». Проверь ошибки — они бывают смешными."},{"t":"Экспорт 1080p","d":"и сохрани в галерею. Готово!"}],"tip":"Первое видео собери коротким — на 2–3 минуты. Монтаж длинного ролика с непривычки отбивает желание, а три минуты — в удовольствие."},{"id":"lyrics-beat","emo":"🎶","title":"Слова под такт: текст появляется вовремя","sub":"Караоке-стиль — строки выскакивают ровно тогда, когда поются","time":"30 минут","diff":2,"intro":"Задача: чтобы строки песни появлялись на экране в нужный момент. В CapCut это делается руками — каждая строка, как деталька конструктора, ставится на своё место. Звучит страшно, делается спокойно: после двух строк рука сама всё запомнит.","steps":[{"t":"Новый проект → добавь минусовку","d":"CapCut → «Новый проект» → выбери видео или фото-фон, затем «Аудио» → «Импорт» → минусовка из «Файлы»."},{"t":"Сначала монтаж, потом текст","d":"если после будешь резать видео, строки сдвинутся. Поэтому цвет и склейки — до текста."},{"t":"Выпиши строки песни","d":"прослушай песню и выпиши её в заметки по фразам — 2–4 секунды каждая. Так быстрее, чем вспоминать на ходу."},{"t":"Включи метки битов","d":"тапни по аудиодорожке → «Биты» → авто-генерация. На дорожке появятся метки — по ним видно, куда ставить начало строк."},{"t":"Добавь первую строку","d":"«Текст» → добавь надпись и вставь первую фразу из заметок. Подбери шрифт, размер, цвет — этот стиль будешь повторять."},{"t":"Поставь её на нужное время","d":"у текстового блока на таймлайне тяни края: левый — когда появится, правый — когда исчезнет. Растяни строку точно на её фразу."},{"t":"Дальше — по одной строке","d":"новая надпись → фраза из заметок → края под музыку. Начни с припева: он повторяется, и строки можно копировать."},{"t":"Анимация появления","d":"выбери строку → «Анимация» → «Вход» → «Появление» или «Печатная машинка»; «Выход» → «Исчезновение». Длительность короткая, 0,2–0,5 секунды."},{"t":"Проверь от начала до конца","d":"просмотри песню и поправь края строк, которые выскочили мимо. Магнит (Snap) в настройках таймлайна помогает ставить края ровно по меткам."},{"t":"Экспорт","d":"1080p, 30 кадров в секунду. Готовое видео — в «Фото»."}],"tip":"Авто-субтитры («Текст» → «Автоматические субтитры») отлично распознают РЕЧЬ, но пение нейросети понимают плохо. Для песни надёжнее поставить строки руками; авто-субтитры можно взять как черновик и потом подправить.","warn":"Названия пунктов в разных версиях CapCut чуть отличаются — если чего-то нет, обнови приложение. Запасной аэродром: та же механика в VN, InShot и KineMaster — текст тоже отдельный слой, края тянутся. В VN ещё есть свои метки бита. А если хочется не видео, а просто петь — есть KaraFun: он сам сделает минус и сам расставит слова."},{"id":"cover","emo":"🖼️","title":"Превью (обложка) для YouTube","sub":"Три картинки, крупный текст — и кликают","time":"25 минут","diff":2,"intro":"Превью решает, нажмут ли на видео. Это как обложка журнала: показать главное, не показать лишнее.","steps":[{"t":"Размер: 1280×720","d":"другие размеры YouTube обрежет или отклонит."},{"t":"Сделай главный объект","d":"в Шедевруме (или возьми своё фото и вырежи фон в Pixelcut)."},{"t":"Напиши 2–4 слова","d":"не предложение: «УРОЖАЙ 2026» лучше, чем «мой большой урожай этого года»."},{"t":"Собери в Photopea","d":"бесплатно, в Safari: фон → объект → крупный текст → экспорт PNG."},{"t":"Проверь на глазке","d":"уменьши превью до размера ногтя — текст читается? Значит, годится."}],"tip":"Лицо человека крупно + удивление + 2–3 слова = рабочая классика. Но не копируй чужие обложки один в один."},{"id":"upload","emo":"▶️","title":"Загрузка и правила YouTube","sub":"Метки ИИ, монетизация и что нельзя","time":"20 минут","diff":2,"intro":"Загрузить видео просто. Важно другое — сделать это так, чтобы видео не сняли с показов и не отказали в монетизации.","warn":"С 16 июля 2026 YouTube не монетизирует «шаблонный» контент: массово клепаные однотипные ролики, шокирующие видео и ИИ-персонажей, дающих советы о здоровье и деньгах. Твоя защита — уникальность: свой голос, комментарий, личный опыт, своя тема.","steps":[{"t":"Отметь, что в видео ИИ","d":"при загрузке YouTube спросит про «изменённый контент» — ставь галочку, если есть реалистичные ИИ-голоса или лица. На охваты это не влияет, а обманывать нельзя."},{"t":"Название и описание","d":"название до 60 знаков с главным словом впереди; в описании — 2–3 предложения и таймкоды глав."},{"t":"Хэштеги — 3–5 штук","d":"в самый низ описания: #дача #огород #своимируками."},{"t":"Превью и «Конечная заставка»","d":"загрузи обложку, добавь в конце призыв «подпишись, дальше — про патиссоны»."},{"t":"Ответь на первые комментарии","d":"первые часы важны: YouTube смотрит, живой ли канал."}],"tip":"Никогда не удаляй видео, которое «не зашло» — оно продолжает приносить просмотры месяцами. Лучше делай следующее."},{"id":"news-2026","emo":"🗞️","title":"Что важно знать в 2026 году","sub":"Какие сервисы закрылись и какие законы появились","time":"7 минут","diff":2,"intro":"Мир нейросетей меняется каждую неделю. Вот главное на сегодня — чтобы ты не искала то, чего уже нет, и не попала впросак.","steps":[{"t":"Закрылись","d":"Sora от OpenAI (апрель 2026), Google Whisk (апрель 2026), сайт remove.bg закроется 1 декабря 2026 (его функции переехали в Canva и Leonardo). Если увидишь «бесплатную Sora» — это обманка."},{"t":"Сменили имя","d":"Riffusion стал Flow Music (теперь внутри Google Flow). Несколько других сервисов тоже переименовались — вывеска другая, внутри то же."},{"t":"Ужесточились правила музыки","d":"Suno добавляет в песни неслышимую метку, а скачивание на бесплатном тарифе почти закрыто. Для монетизируемых видео используй YouTube Аудиотеку. У ElevenLabs стандартные голоса обновляются до конца 2026 года — если делаешь озвучку, сохраняй mp3 сразу."},{"t":"Лимиты стали «плавающими»","d":"С мая 2026 у Gemini нет точного числа картинок в день — лимит меняется по нагрузке (в среднем около 20). Если сегодня дали больше, чем вчера — так и задумано, это не сбой."},{"t":"YouTube с 16.07.2026","d":"не платит за массовый однотипный ИИ-контент. Раскрывать использование ИИ — обязательно, но само раскрытие охваты не уменьшает."},{"t":"В России — маркировка ИИ","d":"с сентября 2026 контент с ИИ рекомендуется помечать. На практике: ставь галочку ИИ при загрузке на YouTube — этого достаточно на обе стороны."}],"tip":"Правило выживания: бесплатные тарифы меняются раз в пару месяцев. Если что-то не сходится с каталогом — верь сайту сервиса, а не каталогу; мы обновляем его, но интернет быстрее."},{"id":"first-project","emo":"🚀","title":"Первый ролик за один вечер","sub":"Полный маршрут: от идеи до публикации — только бесплатное","time":"2–3 часа","diff":2,"intro":"Собираем всё вместе. Вкладка «Моё» → «План первого ролика» — там этот же маршрут в виде галочек. Отмечай по ходу и не торопись.","steps":[{"t":"Идея (15 мин)","d":"«Моё» → чек-лист шаг 1. Помощник: GigaChat — «придумай 10 тем для видео про (твоя тема) для новичков»."},{"t":"Сценарий (20 мин)","d":"Промпты → «Сценарий видео». Вставь тему, получи структуру: хук, 3 части, финал."},{"t":"Озвучка (20 мин)","d":"Самый быстрый путь — записать себя: получится живо и по-настоящему. Альтернатива: Yandex SpeechKit."},{"t":"Картинки и клипы (40 мин)","d":"Шедеврум для картинок, Kling — оживить 1–2 из них. Остальное — фото из Pexels."},{"t":"Музыка (5 мин)","d":"YouTube Studio → Аудиотека. Названия сохраняй в заметки — укажешь при загрузке."},{"t":"Монтаж (40 мин)","d":"CapCut или VN: клипы по порядку, музыка на 25%, автосубтитры, экспорт."},{"t":"Превью (20 мин)","d":"Photopea + Pixelcut — по гайду «Превью»."},{"t":"Публикация (15 мин)","d":"YouTube Studio: метка ИИ, описание, хэштеги. Нажми «Опубликовать» — и отдохни, ты молодец!"}],"tip":"Секрет номер один: второе видео делается в три раза быстрее первого. Секрет номер два: регулярность важнее качества — одно видео в неделю целый год сильнее, чем десять идеальных за месяц."}],"prompts":[{"id":"p-ideas","g":"Идеи","title":"25 идей для видео","for":"Когда не знаешь, о чём снимать","text":"Ты помогаешь вести YouTube-канал. Тема канала: «__». Моя аудитория: обычные люди, которые любят «__». Придумай 25 идей для видео. Формат: номер, название (до 60 знаков), одна строка — о чём видео. 5 идей сделай нестандартными, которые мало кто снимает.","ex":"Тема канала: дача и сад. → «Закопала 5 бутылок на грядке — смотри, что выросло»..."},{"id":"p-check-idea","g":"Идеи","title":"Проверить идею до съёмок","for":"Чтобы не потратить вечер на видео, которое никто не глянет","text":"Оцени идею для ролика: «__». Ответь строго: 1) Кто будет это смотреть и зачем? 2) Какие эмоции вызовет? 3) Слишком ли узкая тема? 4) Как сделать название цепляющим (дай 5 вариантов)? 5) Что можно добавить, чтобы видео запомнили?","ex":"Идея: «Как я выращиваю помидоры на подоконнике»."},{"id":"p-script","g":"Сценарий","title":"Сценарий видео на 8 минут","for":"Готовая структура ролика целиком","text":"Напиши сценарий YouTube-видео на тему «__» длительностью 8 минут. Структура: 1) Хук — первые 15 секунд, которые не дадут уйти (неожиданный факт или вопрос). 2) Представление: зачем смотреть до конца. 3) Три главные части с примерами из жизни простых людей. 4) Финал: итог за 30 секунд и вопрос зрителям. Пиши простым разговорным языком, как будто рассказываешь подруге. Сценарий — от моего лица, женский род.","ex":"Тема: «5 ошибок при посадке огурцов»."},{"id":"p-hook","g":"Сценарий","title":"Хук: первые 15 секунд","for":"Самая важная часть видео","text":"Придумай 10 вариантов первых 15 секунд для видео на тему «__». Каждый — 1–2 предложения, которые цепляют с первой секунды: неожиданный факт, ошибка, вопрос или мини-история. Без фраз «всем привет, сегодня я расскажу» — это мгновенно отпугивает зрителей.","ex":"Тема: «Своими руками полка на кухню»."},{"id":"p-shorts","g":"Сценарий","title":"Сценарий для короткого видео (Shorts)","for":"Ролик до 60 секунд","text":"Напиши сценарий короткого вертикального видео до 60 секунд на тему «__». Три части: 0–3 сек — крючок (вопрос или обещание), 3–50 сек — суть без воды, пунктами, 50–60 сек — вывод и призыв подписаться. Язык — очень простой, короткие предложения, чтобы легко читать вслух.","ex":"Тема: «Почему желтеют листья у комнатных цветов»."},{"id":"p-shorten","g":"Сценарий","title":"Сделать текст проще и короче","for":"Когда текст длинный и «умный», а нужен живой","text":"Перепиши мой текст проще, как будто объясняю маме. Убери умные слова, длинные предложения раздели на короткие. Ничего не выдумывай, смысл не меняй. Сохрани тёплый, дружелюбный тон. Вот текст: «__»","ex":"Вставь свой черновик из GigaChat или свой текст."},{"id":"p-img-scene","g":"Картинки","title":"Картинка-сцена","for":"Красивый кадр для видео или превью","text":"__ (кто) и __ (что делает), в __ (где), __ (время года), __ (время суток), __ (погода), крупный план / общий план, стиль: (мультфильм / реалистичное фото / картина маслом / акварель), тёплый свет, высокое качество","ex":"«Бабушка и рыжий кот пьют чай, на веранде дачного дома, раннее утро, туман, общий план, мультфильм, тёплый свет»."},{"id":"p-img-char","g":"Картинки","title":"Постоянный персонаж серии","for":"Один и тот же герой на всех картинках","text":"Описание персонажа: __ (пол, возраст, причёска, одежда, одна особая примета — например, зелёная шапка). Нарисуй этого персонажа __ (что делает), в __ (где). Стиль: __. Персонаж должен выглядеть точно так же, как в описании — сохрани все черты.","ex":"«Мальчик 8 лет, рыжие волосы, зелёная шапка с помпоном... нарисован как собирает грибы в лесу»."},{"id":"p-img-logo","g":"Картинки","title":"Логотип / значок канала","for":"Простой узнаваемый знак","text":"Простой минималистичный логотип на тему «__». Плоский стиль, не больше двух цветов, толстые чистые линии, без мелких деталей. Должен легко читаться в маленьком размере. Фон прозрачный или одноцветный. (В Ideogram или Recraft можно попросить: знак + надпись «__»)","ex":"Тема: «дача и огород» → знак: лист с каплей воды."},{"id":"p-img-edit","g":"Картинки","title":"Поменять своё фото словами","for":"Отредактировать реальное фото (Nano Banana в Gemini)","text":"Измени это фото: __ (что изменить). Сохрани всё остальное в точности: лицо, позу, фон, свет. Меняй только указанную часть. Результат должен выглядеть как настоящее фото, без эффекта «пластика».","ex":"«Поменяй фон на цветущий сад. Сохрани лицо и одежду в точности.»"},{"id":"p-vid-scene","g":"Видео","title":"Видео из картинки","for":"Kling, PixVerse, Hailuo — оживить кадр","text":"Камера __ (медленно приближается / плавно облетает / отъезжает), __ (что двигается: листья колышутся / вода течёт / человек улыбается и поворачивает голову). Движения медленные и естественные, без резких скачков. Настроение: __ (спокойное / радостное / загадочное).","ex":"«Камера медленно приближается, листья яблони колышутся от ветра, яблоко падает в корзину. Спокойное настроение, золотая осень.»"},{"id":"p-vid-talk","g":"Видео","title":"Оживить фото с речью","for":"Hedra, HeyGen, D-ID","text":"Оживи это фото: человек __ (спокойно/радостно/удивлённо) говорит мне в камеру. Мимика естественная, иногда улыбается, иногда поднимает брови. Легкие кивки головой. Не двигай фон и одежду, только лицо и плечи.","ex":"Сначала сгенерируй текст-поздравление в GigaChat, озвучь в SpeechKit — и дай оба файла в Hedra."},{"id":"p-song","g":"Музыка и голос","title":"Текст песни","for":"Для Suno или для веселья","text":"Напиши текст песни про «__» в стиле «__». Структура: куплет — припев — куплет — припев. В припеве одна простая фраза, которая повторяется и легко запоминается. Простые рифмы, добрый юмор, без сложных слов. Длительность — до 2 минут при пении.","ex":"Тема: «мой огород», стиль: весёлые частушки."},{"id":"p-jingle","g":"Музыка и голос","title":"Музыка для заставки","for":"Короткий джингл канала на 10 секунд","text":"Короткая музыкальная заставка 10 секунд: __ (настроение: весёлая / спокойная / загадочная), в стиле __ (лёгкий поп / акустическая гитара / пианино), без слов. Финал — яркий и завершённый, чтобы сразу начиналось видео.","ex":"«Весёлая заставка 10 секунд, акустическая гитара и хлопки, без слов, бодрое завершение»."},{"id":"p-voice","g":"Музыка и голос","title":"Озвучка текста","for":"Yandex SpeechKit, MiniMax, Fish Audio","text":"Вставь текст сценария как есть. Проставь запятые в местах пауз и точки в конце абзацев. Числа запиши словами (не «5 кг», а «пять килограммов») — так озвучка звучит естественнее. Дополнительно попроси: «прочитать тёплым спокойным голосом, как добрый рассказчик».","ex":"Yandex SpeechKit → «Синтез речи» → выбери голос (например, «Алиса», «Филипп») → вставь текст → скачай mp3."},{"id":"p-cover-idea","g":"Обложка","title":"Идея для превью","for":"Что показать на обложке","text":"Предложи 5 идей для обложки YouTube-видео на тему «__». Для каждой: 1) что показать главным объектом (словами для генерации картинки), 2) какие 2–4 слова написать крупным текстом, 3) какая эмоция на лице (если человек), 4) какой цвет сделать главным, чтобы выделяться среди других обложек в поиске.","ex":"Тема: «Собрала первый урожай огурцов» → объект: огромная корзина огурцов, текст «ТАКОЙ УРОЖАЙ?!»."},{"id":"p-cover-text","g":"Обложка","title":"Текст на обложке","for":"Короткие цепляющие слова","text":"Придумай 15 вариантов коротких надписей (2–4 слова) для обложки видео про «__». Правила: без точки в конце, можно вопрос или восклицание, конкретика лучше общих слов («25 штук с куста» лучше, чем «много огурцов»), без обмана — текст должен соответствовать видео.","ex":"«СТОП! НЕ САЖАЙ ТАК», «ТАКОЙ УРОЖАЙ?!», «5 ОШИБОК»."},{"id":"p-yt-meta","g":"YouTube","title":"Название и описание","for":"Чтобы видео находили в поиске","text":"Для видео на тему «__» напиши: 1) 10 вариантов названия до 60 знаков (главное слово — в начале, без капса целиком). 2) Описание: 2–3 живых предложения, затем «В этом видео:» и 3 пункта, затем 3–5 хэштегов в конце. Не выдумывай факты, которых нет в теме.","ex":"Тема: «Как я делаю компост из травы»."},{"id":"p-yt-chapters","g":"YouTube","title":"Главы (таймкоды)","for":"Разбить видео на удобные части","text":"Разбей сценарий видео на главы. Для каждой главы дай короткое название (2–4 слова) и её примерное время. Формат — таймкоды для описания YouTube. Первая глава обязательно с 00:00. Всего 4–7 глав, каждая не короче минуты. Вот сценарий: «__»","ex":"00:00 Начинаем, 00:45 Первый секрет, 02:10 Что я делаю не так..."},{"id":"p-translate","g":"YouTube","title":"Перевод описания и субтитров","for":"Чтобы канал поняли и за рубежом","text":"Переведи этот текст на простой английский язык. Сохрани смысл, не делай «машинный» перевод. Абзацы оставь как были. Вот текст: «__». Затем отдельно перепиши его же для английских субтитров — короткими фразами, по одной мысли в строке.","ex":"Пригодится и для описания, и для субтитров в YouTube Studio."}],"checklist":[{"id":"k1","t":"Придумать тему канала","d":"О чём будешь рассказывать: дача, кулинария, рукоделие, внуки, путешествия? Пиши то, что любишь — это запас топлива на годы."},{"id":"k2","t":"Создать аккаунт GigaChat","d":"Телефон + код из СМС. Это твой «мозг» для идей и текстов — бесплатно и без VPN."},{"id":"k3","t":"Установить Шедеврум","d":"Самый простой генератор картинок. Вход по Яндекс ID."},{"id":"k4","t":"Придумать идею первого видео","d":"Промпты → «25 идей для видео». Выбери одну, которая нравится тебе самой."},{"id":"k5","t":"Написать сценарий","d":"Промпты → «Сценарий видео». Потом скажи: «сделай проще и короче»."},{"id":"k6","t":"Сделать 5–10 картинок","d":"В Шедевруме по сценарию — про одну на каждый абзац."},{"id":"k7","t":"Оживить 1–2 картинки в Kling","d":"Режим «Image to Video» — получишь живые клипы по 5 секунд."},{"id":"k8","t":"Записать или сгенерировать озвучку","d":"Свой голос в Диктофоне или Yandex SpeechKit. Наговорю по секрету: свой голос покоряет зрителей быстрее."},{"id":"k9","t":"Подобрать музыку","d":"YouTube Studio → Аудиотека — безопасные треки. Сохрани названия в заметки."},{"id":"k10","t":"Смонтировать в CapCut или VN","d":"Клипы по порядку + музыка на 25% + автосубтитры. Экспорт 1080p."},{"id":"k11","t":"Сделать превью","d":"Photopea в Safari: фон + картинка + 2–3 крупных слова. Размер 1280×720."},{"id":"k12","t":"Загрузить на YouTube","d":"YouTube Studio: метка ИИ (если нужно), описание, хэштеги. И — опубликовать! 🎉"}]}</script>

function toolCard(t){

    +'<div><i>Водяной знак</i><b>'+esc(t.watermark||'—')+'</b></div>'

function segOk(t){
  if(state.seg==='vpn')return t.vpn===false;
  if(state.seg==='start')return !!t.star;

}
function appOk(t){return !state.app||!!t.ios;}
function qOk(t){
  if(!state.q)return true;
  var q=state.q.toLowerCase();
  var hay=[t.name,t.nameRu||'',t.tagline,t.what,t.keys||'',CAT[t.cat]?CAT[t.cat].name:''].join(' ').toLowerCase();
  return hay.indexOf(q)>=0;
}
function catOk(t){return state.cat==='all'||t.cat===state.cat;}
function filtered(){return D.tools.filter(function(t){return segOk(t)&&appOk(t)&&catOk(t)&&qOk(t);});}

  return D.tools.filter(function(t){return segOk(t)&&appOk(t)&&(id==='all'||t.cat===id);}).length;

/* ---------- копирование ---------- */
function copyText(txt,btn){
  function ok(){
    btn.classList.add('ok');
    var old=btn.innerHTML;
    btn.innerHTML=ICON.check+'Скопировано!';
    setTimeout(function(){btn.classList.remove('ok');btn.innerHTML=old;},1600);
  }
  function selectText(){
    var card=btn.closest?btn.closest('.card'):null;
    var pEl=card?card.querySelector('.ptext'):null;
    if(!pEl)return false;
    try{
      var r=document.createRange();
      r.selectNodeContents(pEl);
      var sel=window.getSelection();
      sel.removeAllRanges();sel.addRange(r);
      return true;
    }catch(e){return false;}
  }
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=txt;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();ta.setSelectionRange(0,999999);
    var done=false;
    try{done=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
    if(done)ok();
    else if(selectText())btn.innerHTML=ICON.copy+'Текст выделен — нажми «Скопировать»';
    else btn.innerHTML=ICON.copy+'Не вышло — скопируй выделением';
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok,fallback);
  }else fallback();
}

  var light=!themeIsLight();
  document.documentElement.dataset.theme=light?'light':'dark';
  try{localStorage.setItem('nm_theme',light?'light':'dark');}catch(e){}
  $('#tc').setAttribute('content',light?'#f6f5f1':'#07080d');
  syncThemeBtn();
}
function syncThemeBtn(){
  var b=$('#thm');
  if(b)b.innerHTML=themeIsLight()?ICON.moon:ICON.sun;
  $('#tc').setAttribute('content',themeIsLight()?'#f6f5f1':'#07080d');
}
$('#thm').addEventListener('click',function(){toggleTheme();if(state.view==='my')renderView();});

/* ---------- наверх ---------- */
var totop=$('#totop');
window.addEventListener('scroll',function(){
  totop.classList.toggle('show',window.scrollY>700);
},{passive:true});
totop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});

/* ---------- старт ---------- */
var h=(location.hash||'').replace('#','');
if(['cat','guides','prompts','my'].indexOf(h)>=0)state.view=h;
syncThemeBtn();
renderView();
syncTabs();
})();
</script>
</body>
</html>
